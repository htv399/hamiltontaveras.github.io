name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Temporary visual preview. Keep fixtures clearly identified until
      # approved production content and a canonical domain are available.
      SITE_ENV: preview
      SITE_URL: https://htv399.github.io/hamiltontaveras.github.io
      BASE_PATH: /hamiltontaveras.github.io
      DEFAULT_LANGUAGE: ${{ vars.DEFAULT_LANGUAGE || 'en' }}
      CONTACT_MODE: ${{ vars.CONTACT_MODE || 'pending' }}
      ANALYTICS_MODE: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (no lockfile mutation)
        run: npm ci

      - name: Validate preview content and contracts
        run: |
          npm run contracts:validate
          npm run content:validate

      - name: Build
        run: npm run build

      - name: Search index
        run: npm run search:index

      - name: Check links, routes and manifest
        run: |
          npm run links:check
          npm run manifest:check
          npm run placeholders:check
          npm run seo:check
          npm run perf:budget

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
