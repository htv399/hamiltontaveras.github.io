contract:
  id: VIS-001
  version: 1.0.0
  status: required_v1
  objective: "Definir un sistema Blue Finance editorial, contemporáneo y verificable."

principles:
  - id: VIS-PR-001
    status: required_v1
    rule: "La jerarquía surge de escala, composición, densidad, tipo y evidencia visual."
  - id: VIS-PR-002
    status: required_v1
    rule: "Las cards se reservan para unidades discretas. Los listings principales usan filas y composiciones editoriales."
  - id: VIS-PR-003
    status: required_v1
    rule: "No repetir cajas con una línea de color lateral. Un callout solo existe por una función semántica."
  - id: VIS-PR-004
    status: required_v1
    rule: "Los fondos alternan para marcar capítulos editoriales, no para decorar cada bloque."
  - id: VIS-PR-005
    status: required_v1
    rule: "Gold se reserva para selección, anotación o resultado principal."
  - id: VIS-PR-006
    status: future
    rule: "Dark mode requiere tokens y QA específicos antes de implementarse."

colors:
  navy_900: { value: "#0B1F33", use: ["navigation", "display_text", "high_contrast_background"] }
  ink_800: { value: "#16283A", use: ["body_emphasis", "subhead"] }
  blue_600: { value: "#1F5A92", use: ["links", "active_state", "primary_series"] }
  azure_400: { value: "#4F8FC0", use: ["comparison_series", "secondary_detail"] }
  slate_500: { value: "#607284", use: ["metadata", "axes", "notes"] }
  mist_100: { value: "#E8EEF3", use: ["soft_section", "table_header", "input_cell"] }
  paper: { value: "#FAFBFC", use: ["alternate_page_background"] }
  white: { value: "#FFFFFF", use: ["primary_surface"] }
  gold_500: { value: "#C58A2A", use: ["selected_point", "key_annotation", "primary_result_rule"], max_area_percent: 5 }
  negative: { value: "#A6403B", use: ["loss", "risk", "error"], requires_text_label: true }
  positive: { value: "#2F6F5E", use: ["favorable_result"], requires_text_label: true }
  focus: { value: "#F2B544", use: ["keyboard_focus"] }

contrast:
  id: VIS-COLOR-001
  status: required_v1
  standard: WCAG_2_2_AA
  normal_text_min: 4.5
  large_text_min: 3.0
  non_text_min: 3.0
  forbidden_pairs:
    - ["gold_500", "white"]
    - ["azure_400", "white_for_body_text"]

typography:
  fonts:
    ui:
      family: "IBM Plex Sans"
      fallback: "system-ui, sans-serif"
      source: "self_hosted_or_pinned_webfont"
    editorial:
      family: "Source Serif 4"
      fallback: "Georgia, serif"
      source: "self_hosted_or_pinned_webfont"
    mono:
      family: "IBM Plex Mono"
      fallback: "ui-monospace, monospace"
      source: "self_hosted_or_pinned_webfont"
  numeric_features: ["tabular-nums", "lining-nums"]
  scale:
    display_xl: { min_rem: 2.75, preferred_vw: 5.2, max_rem: 5.25, line_height: 0.98, weight: 600 }
    display_l: { min_rem: 2.25, preferred_vw: 4.0, max_rem: 4.0, line_height: 1.02, weight: 600 }
    h1: { min_rem: 2.0, preferred_vw: 3.2, max_rem: 3.25, line_height: 1.08, weight: 600 }
    h2: { min_rem: 1.55, preferred_vw: 2.2, max_rem: 2.25, line_height: 1.15, weight: 600 }
    h3: { min_rem: 1.25, preferred_vw: 1.5, max_rem: 1.5, line_height: 1.25, weight: 600 }
    body_l: { rem: 1.1875, line_height: 1.65 }
    body: { rem: 1.0, line_height: 1.6 }
    small: { rem: 0.875, line_height: 1.45 }
    micro: { rem: 0.75, line_height: 1.35, letter_spacing_em: 0.04 }
  usage:
    long_form: "editorial"
    ui_and_headings: "ui"
    code_ids_and_dense_numbers: "mono"
    uppercase: "only_micro_labels"

spacing:
  base_px: 8
  tokens_px:
    0: 0
    1: 4
    2: 8
    3: 12
    4: 16
    5: 24
    6: 32
    7: 48
    8: 64
    9: 96
    10: 120
    11: 144
  section_dense: "64px clamp to 96px"
  section_standard: "80px clamp to 120px"
  section_feature: "96px clamp to 144px"

layout:
  shell_max_px: 1440
  editorial_max_px: 1360
  reading_min_px: 720
  reading_max_px: 780
  gutters:
    desktop_px: 40
    tablet_px: 28
    mobile_px: 20
  grid:
    desktop: { columns: 12, gap_px: 24, patterns: ["7+5", "8+4", "2+1"] }
    tablet: { columns: 8, gap_px: 20 }
    mobile: { columns: 4, gap_px: 16 }
  header_height:
    desktop_px: 76
    mobile_px: 62

breakpoints:
  wide: { min_px: 1200 }
  tablet: { max_px: 1199, min_px: 769 }
  mobile: { max_px: 768 }
  compact: { max_px: 480 }
  minimum_tested_px: 360

surfaces:
  allowed_sequence: ["navy", "paper", "white", "mist", "white"]
  max_consecutive_card_sections: 1
  full_bleed_visuals: "allowed_only_for_featured_evidence"
  alternating_rule: "Adjacent sections must differ by composition, density or surface. Color change alone is insufficient."

borders:
  hairline: "1px solid rgba(11,31,51,0.16)"
  strong: "1px solid rgba(11,31,51,0.34)"
  key_result: "2px solid #C58A2A"
  usage: "Prefer horizontal rules and grouping over full boxes."

radii:
  none: 0
  small_px: 4
  medium_px: 8
  pill_px: 999
  rule: "Pill only for controls and status. Editorial content uses none or small."

shadows:
  none: "none"
  layer_1: "0 8px 24px rgba(11,31,51,0.08)"
  layer_2: "0 16px 40px rgba(11,31,51,0.12)"
  rule: "No shadow on ordinary editorial cards. Use layer_1 for overlay or floating control only."

motion:
  duration_fast_ms: 120
  duration_standard_ms: 220
  easing: "cubic-bezier(0.2, 0, 0, 1)"
  allowed: ["menu", "filter_state", "chart_highlight", "disclosure"]
  forbidden: ["scroll_jacking", "parallax", "continuous_decorative_motion"]
  reduced_motion: "Disable nonessential transitions and animated chart interpolation."

charts:
  id: VIS-DATA-001
  required_metadata: ["title", "unit", "data_vintage", "source", "method_note", "accessible_summary"]
  palette_order: ["navy_900", "blue_600", "azure_400", "slate_500", "gold_500"]
  dominant_series_max: 1
  mobile_min_height_px: 280
  mobile_rules:
    - "Reduce ticks before reducing label size."
    - "Use direct labels where they remain legible."
    - "Keep the accessible summary adjacent."
  annotation:
    key_point_color: gold_500
    max_key_annotations: 2
  gridlines: "light_horizontal_only_when_useful"
  source_position: "immediately_below_figure"
  download_position: "figure_resources"

tables:
  numeric_alignment: right
  label_alignment: left
  header_background: mist_100
  decimals: consistent_per_column
  negative_values: "minus_sign_by_default"
  subtotal_treatment: "horizontal_rule_and_weight"
  inputs: "mist_background"
  outputs: "very_light_blue_background"
  principal_result: "gold_rule_not_gold_fill"
  mobile:
    strategy_order: ["responsive_summary", "horizontal_scroll", "sticky_first_column"]
    min_touch_target_px: 44
    accessible_caption_required: true

responsive:
  hero:
    desktop: "text_and_visual_7_5_or_8_4"
    mobile: "text_first_then_simplified_visual"
  indicators:
    desktop: "four_to_six_columns"
    mobile: "horizontal_scroll_with_snap_or_selector"
  metadata:
    desktop: "horizontal_band"
    mobile: "stacked_compact_list"
  downloads:
    desktop: "visible_group"
    mobile: "primary_action_plus_secondary_menu"
  code:
    mobile: "horizontal_scroll_never_shrink_below_readable_size"

verification:
  tests:
    - { id: QA-VIS-001, checks: ["token_usage", "no_raw_color_in_components"] }
    - { id: QA-VIS-002, checks: ["contrast_AA", "focus_visible"] }
    - { id: QA-VIS-003, checks: ["1440", "1200", "768", "480", "360"] }
    - { id: QA-VIS-004, checks: ["no_repetitive_left_rule_boxes", "no_uniform_card_wall"] }
    - { id: QA-VIS-005, checks: ["chart_metadata", "table_numeric_alignment", "mobile_alternative"] }

