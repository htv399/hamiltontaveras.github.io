contract:
  id: IA-001
  version: 1.0.0
  status: required_v1

primary_navigation:
  - { id: IA-NAV-001, key: home, label_en: Home, label_es: Inicio, route_en: "/", route_es: "/es/" }
  - { id: IA-NAV-002, key: daas_platform, label_en: DaaS Platform, label_es: Plataforma DaaS, route_en: "/daas-platform/", route_es: "/es/daas-platform/" }
  - { id: IA-NAV-003, key: impact_products, label_en: Impact Products, label_es: Productos de impacto, route_en: "/impact-products/", route_es: "/es/impact-products/" }
  - { id: IA-NAV-004, key: teaching, label_en: Teaching, label_es: Docencia, route_en: "/teaching/", route_es: "/es/teaching/" }
  - { id: IA-NAV-005, key: about, label_en: About Me, label_es: Sobre mí, route_en: "/about/", route_es: "/es/about/" }
  - { id: IA-NAV-006, key: search, label_en: Search, label_es: Buscar, route_en: "/search/", route_es: "/es/search/" }

utilities:
  - { id: IA-UTIL-001, key: cv, behavior: "Contextual link inside About; never a primary navigation entry.", route_en: "/cv/", route_es: "/es/cv/" }
  - { id: IA-UTIL-003, key: language, behavior: "Compact ES/EN switch at the right; use the reciprocal route or the target-language Home fallback and preserve the explicit choice for the session." }

footer_navigation:
  required: ["contact", "resources", "licenses", "accessibility", "rss", "sitemap"]
  optional_when_configured: ["repository", "linkedin", "orcid", "scholar"]

forbidden_primary_entries:
  id: IA-NAV-007
  status: required_v1
  values: ["work", "research", "notes", "profile", "cv", "data", "economics", "finance", "valuation", "quantitative-finance", "projects", "blog"]
  reason: "These are taxonomies, formats or legacy labels."

routes:
  static:
    home: { en: "/", es: "/es/" }
    daas_platform: { en: "/daas-platform/", es: "/es/daas-platform/" }
    impact_products: { en: "/impact-products/", es: "/es/impact-products/" }
    teaching: { en: "/teaching/", es: "/es/teaching/" }
    about: { en: "/about/", es: "/es/about/" }
    cv: { en: "/cv/", es: "/es/cv/" }
    contact: { en: "/contact/", es: "/es/contact/" }
    resources: { en: "/resources/", es: "/es/resources/" }
    search: { en: "/search/", es: "/es/search/" }
    licenses: { en: "/licenses/", es: "/es/licenses/" }
    accessibility: { en: "/accessibility/", es: "/es/accessibility/" }
    not_found: { shared: "/404.html" }
  dynamic:
    analysis: "/analysis/{slug}/"
    catalog_entry: "/daas-platform/catalog/{slug}/"
    dashboard_or_monitor: "/daas-platform/{slug}/"
    impact_product: "/impact-products/{slug}/"
    course: "/teaching/{course_slug}/"
    week: "/teaching/{course_slug}/{week_slug}/"
    material: "/teaching/{course_slug}/{week_slug}/materials/{material_slug}/"
    thematic: "/topics/{taxonomy_slug}/"
    content_language_rule: "Interface routes exist in English and Spanish. Authored academic content keeps its source language and declares it explicitly."

slug_rules:
  id: IA-SLUG-001
  status: required_v1
  pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  immutable_after_publish: true
  reserved: ["admin", "api", "assets", "search", "404", "feed", "rss"]
  change_requires_redirect: true
  duplicate_across_collection: false
  translation_rule: "Do not translate an existing published slug without a redirect."

hierarchy:
  - { parent: home, children: ["indicator_strip", "daas_platform", "impact_products", "teaching", "about"] }
  - { parent: daas_platform, children: ["catalog_entry", "dashboard", "monitor", "business_data_explorer", "resource"] }
  - { parent: impact_products, children: ["impact_product"] }
  - { parent: teaching, children: ["course"] }
  - { parent: course, children: ["week"] }
  - { parent: week, children: ["material"] }

breadcrumbs:
  hidden_on: ["home", "first_level_landings"]
  required_on: ["project_detail", "research_detail", "note_detail_when_series", "course", "week", "material", "topic"]
  rules:
    - "Use visible labels from content metadata."
    - "Include structured BreadcrumbList JSON-LD."
    - "Do not include the current page as an active link."

relationships:
  related_work:
    id: IA-REL-001
    strategy: "deterministic_metadata_score"
    score:
      same_domain: 3
      same_method: 2
      same_object: 2
      explicit_related_id: 5
      same_language: 1
    exclude: ["current_item", "private", "draft", "placeholder_in_production"]
    max_items: 4
    fallback: "omit_component"
  course_sequence:
    id: IA-REL-002
    source: "week_number_then_published_at"
    links: ["previous_week", "course_index", "next_week"]
  translations:
    id: IA-REL-003
    source: "translation_key"
    rule: "hreflang and language switch appear only between real equivalents."

taxonomy_landings:
  status: future
  generation_threshold: 3
  dimensions: ["domain", "method", "object"]
  v1_behavior: "Filters work inside Work, Research and Notes. Do not generate thin topic pages."

bilingual:
  model: "equivalent_english_and_spanish_interfaces"
  default_language: { status: required_v1, value: en }
  interface_languages: [en, es]
  content_languages: [en, es]
  language_selector: "visible_compact_es_en"
  preference: "Persist an explicit selector choice in sessionStorage."
  fallback: "Never auto-translate. Use the target-language Home when no reciprocal page exists and preserve the authored content language."
  hreflang: "Emit for every real reciprocal equivalent."

redirects:
  source_file: "src/data/redirects.yml"
  migration_map:
    work: "/daas-platform/"
    research: "/impact-products/"
    notes: "/impact-products/"
  validation:
    - "No chains."
    - "No loops."
    - "Every destination exists."
    - "Legacy Quarto routes are preserved when known."

verification:
  - { id: QA-IA-001, requirement: "Every declared static route builds." }
  - { id: QA-IA-002, requirement: "No forbidden primary entry appears." }
  - { id: QA-IA-003, requirement: "Every published slug is unique and valid." }
  - { id: QA-IA-004, requirement: "No hreflang points to a missing or non-equivalent page." }
  - { id: QA-IA-005, requirement: "Breadcrumbs and related work follow deterministic rules." }

